<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>BrewSystem 2.0 Dashboard</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .status-field { display: none; }
  </style>
</head>
<body>

  <!-- TOP BAR -->
  <header class="navbar">
    <div class="title">BrewSystem 2.0</div>
    <div class="nav-item">OVERVIEW</div>
  </header>

  <div class="panel">

    <!-- POTS -->
    <h1 class="section-header">Pots</h1>
    <div class="card-grid">

      <!-- BK -->
      <div class="card">
        <h2>
          BK
          <span id="bkIndicator" class="indicator off"></span>
        </h2>
        <div class="field status-field">
          <span class="label">Status:</span><span id="bkPot">–</span>
        </div>
        <!-- temperature -->
        <div class="field--center">
          <span class="value-medium">
            <span id="bkTemp">–</span>&thinsp;°C
          </span>
        </div>
        <!-- efficiency -->
        <div class="field--center">
          <span class="value-medium">
            <span id="bkEff">–</span>&thinsp;%
          </span>
        </div>
        <!-- regulator -->
        <div class="field status-field">
          <span class="value-medium">
            REG:&thinsp;<span id="bkReg">–</span>
          </span>
        </div>
        <!-- timer -->
        <div class="field--center">
          <span class="value-medium">
            <span>Timer:</span>
            <span id="timerBK" class="value-medium__number">–</span>
            <span class="unit">&thinsp;min</span>
          </span>
        </div>
      </div>

      <!-- MLT -->
      <div class="card">
        <h2>MLT</h2>
        <div class="field--center">
          <span class="value-large">
            <span id="mltTemp">–</span>&thinsp;°C
          </span>
        </div>
        <!-- timer -->
        <div class="field--center">
          <span class="value-medium">
            <span>Timer:</span>
            <span id="timerMLT" class="value-medium__number">–</span>
            <span class="unit">&thinsp;min</span>
          </span>
        </div>
      </div>

      <!-- HLT -->
      <div class="card">
        <h2>
          HLT
          <span id="hltIndicator" class="indicator off"></span>
        </h2>
        <div class="field status-field">
          <span class="label">Status:</span><span id="hltPot">–</span>
        </div>
        <div class="field--center">
          <span class="value-medium">
            <span id="hltTemp">–</span>&thinsp;°C
          </span>
        </div>
        <div class="field--center">
          <span class="value-medium">
            <span id="hltEff">–</span>&thinsp;%
          </span>
        </div>
        <div class="field status-field">
          <span class="value-medium">
            REG:&thinsp;<span id="hltReg">–</span>
          </span>
        </div>
      </div>
    </div>

    <!-- PUMPS -->
    <h1 class="section-header">Pumps</h1>
    <div class="card-grid">
      <!-- P1 -->
      <div class="card">
        <h2>
          P1
          <span id="p1Indicator" class="indicator off"></span>
        </h2>
        <div class="field status-field">
          <span class="label">Status:</span><span id="pump1">–</span>
        </div>
        <div class="field--center">
          <span class="value-medium">
            <span id="pump1Speed">–</span>&thinsp;%
          </span>
        </div>
      </div>
      <!-- P2 -->
      <div class="card">
        <h2>
          P2
          <span id="p2Indicator" class="indicator off"></span>
        </h2>
        <div class="field status-field">
          <span class="label">Status:</span><span id="pump2">–</span>
        </div>
        <div class="field--center">
          <span class="value-medium">
            <span id="pump2Speed">–</span>&thinsp;%
          </span>
        </div>
      </div>
    </div>

  </div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
