<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>BrewSystem 2.0 Dashboard</title>
  <!-- link to your extracted stylesheet -->
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

  <!-- TOP BAR -->
  <header class="navbar">
    <div class="title">BrewSystem 2.0</div>
    <div class="nav-item">OVERVIEW</div>
  </header>

  <!-- MAIN CONTENT PANEL -->
  <div class="panel">

    <!-- POTS SECTION -->
    <h1 class="section-header">Pots</h1>
    <div class="card-grid">
      <!-- BK -->
      <div class="card">
        <h2>
          BK
          <span id="bkIndicator" class="indicator off"></span>
        </h2>
        <div class="field status-field"><span class="label">Status:</span><span id="bkPot">–</span></div>
        <div class="field">
          <span class="label">Temperature:</span>
          <span id="bkTemp">–</span><span class="unit">°C</span>
        </div>
        <div class="field"><span class="label">Efficiency:</span><span id="bkEff">–</span></div>
        <div class="field"><span class="label">Regulator:</span><span id="bkReg">–</span></div>
      </div>

      <!-- MLT -->
      <div class="card">
        <h2>MLT</h2>
        <div class="field--center">
          <span class="value-large">
            <span id="mltTemp">–</span><span class="unit">°C</span>
          </span>
        </div>
      </div>

      <!-- HLT -->
      <div class="card">
        <h2>
          HLT
          <span id="hltIndicator" class="indicator off"></span>
        </h2>
        <div class="field status-field"><span class="label">Status:</span><span id="hltPot">–</span></div>
        <div class="field">
          <span class="label">Temperature:</span>
          <span id="hltTemp">–</span><span class="unit">°C</span>
        </div>
        <div class="field"><span class="label">Efficiency:</span><span id="hltEff">–</span></div>
        <div class="field"><span class="label">Regulator:</span><span id="hltReg">–</span></div>
      </div>
    </div>

    <!-- PUMPS SECTION -->
    <h1 class="section-header">Pumps</h1>
    <div class="card-grid">
      <!-- Pump 1 -->
      <div class="card">
        <h2>
          P1
          <span id="p1Indicator" class="indicator off"></span>
        </h2>
        <!-- leave this in the markup… -->
        <div class="field status-field">
          <span class="label">Status:</span>
          <span id="pump1">–</span>
        </div>
        <!-- …but hide it in your CSS: -->
        <style>
          .status-field { display: none; }
        </style>
        <div class="field--center">
          <span class="value-medium" id="pump1Speed">–</span>
        </div>
      </div>

      <!-- Pump 2: same thing -->
      <div class="card">
        <h2>
          P2
          <span id="p2Indicator" class="indicator off"></span>
        </h2>
        <div class="field status-field">
          <span class="label">Status:</span>
          <span id="pump2">–</span>
        </div>
        <div class="field--center">
          <span class="value-medium" id="pump2Speed">–</span>
        </div>
      </div>
    </div>


  <!-- your existing TS bundle -->
  <script type="module" src="/js/main.js"></script>
</body>
</html>
