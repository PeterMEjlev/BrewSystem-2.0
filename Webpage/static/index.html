<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>BrewSystem 2.0 Dashboard</title>
  <style>
    /* NAVBAR */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #2c3e50;
      color: #fff;
      padding: 0.75rem 1rem;
      font-size: 1.1rem;
    }
    .navbar .title { font-weight: bold; }
    .navbar .nav-item { cursor: pointer; }

    /* PAGE & PANEL */
    body {
      margin: 0;
      font-family: sans-serif;
      background: #ecf0f1;
      color: #333;
    }
    .panel {
      background: #fff;
      margin: 1rem auto;
      padding: 1.5rem;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      max-width: 1100px;
    }

    /* SECTION HEADERS */
    h1.section-header {
      margin: 2rem 0 1rem;              /* ↑ more vertical gap above */
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid #bdc3c7;
      padding-bottom: 0.25rem;
      font-size: 1.25rem;
      text-align: center;
    }

    /* GRID OF CARDS */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1rem;
    }
    .card {
      border: 1px solid #bdc3c7;
      border-radius: 6px;
      padding: 1rem;
    }
    .card h2 {
      margin: 0 0 0.75rem;
      font-size: 1.2rem;
      text-align: center;
    }
    .field {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.5rem;
    }
    .field:last-child {
      margin-bottom: 0;
    }
    .label {
      font-weight: bold;
    }
    @media (max-width: 600px) {
      .card-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- TOP BAR -->
  <header class="navbar">
    <div class="title">BREWSYSTEM 2.0</div>
    <div class="nav-item">OVERVIEW</div>
  </header>

  <!-- MAIN CONTENT PANEL -->
  <div class="panel">

    <!-- POTS SECTION -->
    <h1 class="section-header">Pots</h1>
    <div class="card-grid">
      <!-- BK -->
      <div class="card">
        <h2>BK</h2>
        <div class="field"><span class="label">Status:</span><span id="bkPot">–</span></div>
        <div class="field"><span class="label">Efficiency:</span><span id="bkEff">–</span></div>
        <div class="field">
          <span class="label">Temperature:</span>
          <span class="value">
          <span id="bkTemp">–</span><span class="unit">°C</span>
          </span>
        </div>
        <div class="field"><span class="label">Regulator:</span><span id="bkReg">–</span></div>
      </div>

      <!-- MLT -->
      <div class="card">
        <h2>MLT</h2>
        <div class="field">
          <span class="label">Temperature:</span>
          <span class="value">
          <span id="mltTemp">–</span><span class="unit">°C</span>
          </span>
        </div>
      </div>

      <!-- HLT -->
      <div class="card">
        <h2>HLT</h2>
        <div class="field"><span class="label">Status:</span><span id="hltPot">–</span></div>
        <div class="field"><span class="label">Efficiency:</span><span id="hltEff">–</span></div>
        <div class="field">
          <span class="label">Temperature:</span>
          <span class="value">
          <span id="hltTemp">–</span><span class="unit">°C</span>
          </span>
        </div>
        <div class="field"><span class="label">Regulator:</span><span id="hltReg">–</span></div>
      </div>
    </div>

    <!-- PUMPS SECTION -->
    <h1 class="section-header">Pumps</h1>
    <div class="card-grid">
      <!-- Pump 1 -->
      <div class="card">
        <h2>P1</h2>
        <div class="field"><span class="label">Status:</span><span id="pump1">–</span></div>
        <div class="field"><span class="label">Efficiency:</span><span id="pump1Speed">–</span></div>
      </div>

      <!-- Pump 2 -->
      <div class="card">
        <h2>P2</h2>
        <div class="field"><span class="label">Status:</span><span id="pump2">–</span></div>
        <div class="field"><span class="label">Efficiency:</span><span id="pump2Speed">–</span></div>
      </div>
    </div>

  </div>

  <!-- your existing TS bundle -->
  <script type="module" src="/js/main.js"></script>
</body>
</html>
